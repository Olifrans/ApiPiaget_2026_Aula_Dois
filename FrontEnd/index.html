<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão - Alunos & Professores</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>Sistema</span>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="alunos">
                    <i class="fas fa-user-graduate"></i>
                    <span>Alunos</span>
                </button>
                <button class="nav-item" data-tab="professores">
                    <i class="fas fa-chalkboard-teacher"></i>
                    <span>Professores</span>
                </button>
                <button class="nav-item" data-tab="dashboard">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1 id="pageTitle">👨‍🎓 Alunos</h1>
                <div class="header-actions">
                    <button id="btnAdd" class="btn-primary">
                        <i class="fas fa-plus"></i> Novo
                    </button>
                    <button id="btnRefresh" class="btn-secondary">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </header>

            <!-- Search & Filter -->
            <div class="search-bar">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por nome, email ou telefone...">
                </div>
                <div class="filter-wrapper">
                    <select id="filterSelect">
                        <option value="all">Todos</option>
                        <option value="alunos">Alunos</option>
                        <option value="professores">Professores</option>
                    </select>
                </div>
            </div>

            <!-- Statistics Cards -->
            <section class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="totalAlunos">0</h3>
                        <p>Total de Alunos</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="totalProfessores">0</h3>
                        <p>Total de Professores</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="totalGeral">0</h3>
                        <p>Total Geral</p>
                    </div>
                </div>
            </section>

            <!-- Table -->
            <section class="table-container">
                <div class="table-wrapper">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Telefone</th>
                                <th>Tipo</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Dados serão inseridos aqui via JavaScript -->
                        </tbody>
                    </table>
                </div>
                <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i> Carregando...
                </div>
            </section>

            <!-- Pagination -->
            <div class="pagination">
                <button id="prevPage" class="btn-page"><i class="fas fa-chevron-left"></i></button>
                <span id="pageInfo">Página 1 de 1</span>
                <button id="nextPage" class="btn-page"><i class="fas fa-chevron-right"></i></button>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Novo Registro</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="formModal">
                <input type="hidden" id="formId">
                <input type="hidden" id="formType" value="aluno">
                
                <div class="form-group">
                    <label for="formNome">Nome</label>
                    <input type="text" id="formNome" placeholder="Digite o nome" required>
                </div>
                
                <div class="form-group">
                    <label for="formEmail">Email</label>
                    <input type="email" id="formEmail" placeholder="Digite o email" required>
                </div>
                
                <div class="form-group">
                    <label for="formTelefone">Telefone</label>
                    <input type="text" id="formTelefone" placeholder="(00) 00000-0000" required>
                </div>
                
                <div class="form-group">
                    <label for="formTipo">Tipo</label>
                    <select id="formTipo">
                        <option value="aluno">Aluno</option>
                        <option value="professor">Professor</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelModal">Cancelar</button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
